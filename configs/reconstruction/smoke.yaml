reconstruction:
  dataset: outputs/reconstruction_mock.npz
  output_dir: outputs/reconstruction-smoke
  target_key: initial_field
  galaxy_key: galaxy_overdensity
  lensing_key: weak_lensing_map
  cmb_key: cmb_features
  group_key: group_id
  simulation_id_key: simulation_id
  survey_mask_key: survey_mask
  seed: 42
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  ridge_alpha: 0.000001
  neural_epochs: 2
  batch_size: 2
  learning_rate: 0.001
  architecture: unet3d
  optimizer: adamw
  scheduler: none
  device: cpu
  lambda_field: 1.0
  lambda_pk: 0.0
  lambda_gradient: 0.0
  lambda_mean: 0.0
  cosmological_parameters: {}
  run_neural: false
